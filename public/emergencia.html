<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#351650" />
  <title>Números de emergencia — Empoderate</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fbf8f2; color: #24103a; }
    main { max-width: 32rem; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; color: #351650; }
    p { line-height: 1.5; margin: 0 0 16px; }
    .aviso { background: #efe7f7; border-radius: 12px; padding: 12px 16px; font-size: .95rem; }
    a.tel { display: block; margin: 0 0 12px; padding: 16px 20px; border-radius: 16px; text-decoration: none;
            background: #fff; color: #351650; border: 2px solid #d9c7ec; font-weight: 700; font-size: 1.15rem; }
    a.tel small { display: block; font-weight: 400; font-size: .9rem; color: #5b4a6b; margin-top: 4px; }
    a.tel.urgente { background: #351650; color: #fff; border-color: #351650; }
    a.tel.urgente small { color: #e5d8f2; }
    button { margin-top: 8px; padding: 12px 20px; border-radius: 999px; border: 0; background: #5b2a86; color: #fff; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>No hay conexión</h1>
    <p class="aviso">Puedes llamar aunque no tengas internet: las llamadas no usan datos.</p>
    <a class="tel urgente" href="tel:911">911<small>Si estás en peligro ahora</small></a>
    <a class="tel" href="tel:+526681025080">668 102 5080<small>Línea de atención · Secretaría de las Mujeres de Ahome</small></a>
    <p>Cuando vuelva la conexión, regresa a Empoderate para ver tus opciones o pedir apoyo.</p>
    <button type="button" onclick="location.href='/'">Volver a intentar</button>
  </main>
</body>
</html>
